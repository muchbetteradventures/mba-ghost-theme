<!--
  Email capture form — Ghost editor snippet (static HTML).

  This is NOT a theme template. Handlebars ({{...}}) does not run inside post
  content, so this is plain HTML with the Mailchimp action and loader SVG inlined.
  It reuses the theme's existing `.subscribe-form` styles from assets/css/screen.css.

  To install as a reusable editor block, see snippets/README.md.
  For template-level use inside .hbs files, use partials/email-capture.hbs instead.
-->
<section class="subscribe-form">
    <h3 class="subscribe-form-title">Get the Much Better newsletter</h3>
    <p class="subscribe-form-description">Get weekly inspiration, positive stories, exclusive community invites and other weird and wonderful stuff.</p>
    <form
        action="https://muchbetteradventures.us2.list-manage.com/subscribe/post?u=8ef039ed02db26fcd1c723274&id=a887ab1707"
        target="_blank" method="post">
        <div class="form-group">
            <input class="subscribe-email" name="EMAIL" placeholder="youremail@example.com" />
            <input type="hidden" name="gdpr[13]" value="Y" class="av-checkbox gdpr">
            <button class="button primary" type="submit">
                <span class="button-content">Subscribe</span>
                <span class="button-loader">
                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px"
                        y="0px" width="40px" height="40px" viewBox="0 0 40 40" enable-background="new 0 0 40 40" xml:space="preserve">
                        <path opacity="0.2" fill="#000" d="M20.201,5.169c-8.254,0-14.946,6.692-14.946,14.946c0,8.255,6.692,14.946,14.946,14.946
                        s14.946-6.691,14.946-14.946C35.146,11.861,28.455,5.169,20.201,5.169z M20.201,31.749c-6.425,0-11.634-5.208-11.634-11.634
                        c0-6.425,5.209-11.634,11.634-11.634c6.425,0,11.633,5.209,11.633,11.634C31.834,26.541,26.626,31.749,20.201,31.749z" />
                        <path fill="#000" d="M26.013,10.047l1.654-2.866c-2.198-1.272-4.743-2.012-7.466-2.012h0v3.312h0
                        C22.32,8.481,24.301,9.057,26.013,10.047z">
                            <animateTransform attributeType="xml" attributeName="transform" type="rotate" from="0 20 20" to="360 20 20"
                                dur="0.5s" repeatCount="indefinite" />
                        </path>
                    </svg>
                </span>
            </button>
        </div>
        <div class="message-success">
            <strong>Great!</strong> Check your inbox and click the link to confirm your subscription.
        </div>
        <div class="message-error">
            Please enter a valid email address!
        </div>
    </form>
</section>
